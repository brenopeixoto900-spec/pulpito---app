<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Púlpito App - Bíblia ACF</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#facc15">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}.biblia{font-family:Merriweather,serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<header class="sticky top-0 z-50 bg-black/95 backdrop-blur border-b border-zinc-800 p-4 flex justify-between items-center">
<h1 class="font-black text-yellow-400 text-xl tracking-widest">PÚLPITO</h1>
<div class="flex gap-2">
<button id="btnTimer" class="bg-zinc-900 border border-zinc-700 px-3 py-1.5 rounded-full text-xs font-bold">⏱️ 00:00</button>
<button id="btnNotas" class="bg-yellow-400 text-black px-4 py-1.5 rounded-full text-xs font-black">NOTAS</button>
</div>
</header>

<div id="timerBar" class="hidden bg-yellow-400 text-black text-center py-2 font-black text-lg">00:00 - PREGANDO</div>

<main class="max-w-4xl mx-auto flex flex-col md:flex-row">
<!-- BIBLIA -->
<div id="bibliaArea" class="flex-1 p-4">
<div class="bg-zinc-900 rounded-2xl p-4 border border-zinc-800">
<div class="flex gap-2">
<select id="livro" class="flex-1 bg-black border border-zinc-700 rounded-xl p-3 text-sm font-bold"></select>
<select id="capitulo" class="w-24 bg-black border border-zinc-700 rounded-xl p-3 text-sm font-bold"></select>
</div>
<button id="ler" class="w-full mt-3 bg-yellow-400 text-black font-black py-3 rounded-xl">LER CAPÍTULO</button>
</div>

<div id="versiculos" class="mt-4 bg-zinc-900 rounded-2xl p-5 border border-zinc-800 min-h-[300px]">
<p class="text-zinc-500 text-sm text-center mt-10">Selecione um livro e capítulo acima e clique em LER CAPÍTULO.<br><br>Todos os 66 livros disponíveis.</p>
</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<button id="btnQr" class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center"><p class="text-xl">📺</p><p class="text-xs font-bold mt-1">QR PROJEÇÃO</p></button>
<button id="btnHoly" class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center"><p class="text-xl">🔗</p><p class="text-xs font-bold mt-1">HOLYRICS SYNC</p></button>
</div>
<div id="qrcode" class="hidden mt-4 bg-white p-4 rounded-2xl flex justify-center"></div>
</div>

<!-- BLOCO DE NOTAS DO PREGADOR -->
<div id="notasArea" class="hidden flex-1 p-4 space-y-4 bg-black md:border-l border-zinc-800">
<h2 class="font-black text-yellow-400">BLOCO DO PREGADOR</h2>

<div class="space-y-3" id="camposPregacao"></div>

<button onclick="salvarSermao()" class="w-full bg-white text-black font-black py-3 rounded-xl mt-4">SALVAR SERMÃO</button>
<button onclick="document.getElementById('notasArea').classList.add('hidden');document.getElementById('bibliaArea').classList.remove('hidden')" class="w-full bg-zinc-900 border border-zinc-800 py-3 rounded-xl text-sm">VOLTAR PRA BÍBLIA</button>
</div>
</main>

<script>
// 66 LIVROS COM CAPÍTULOS
const livros = [
["Gênesis",50],["Êxodo",40],["Levítico",27],["Números",36],["Deuteronômio",34],
["Josué",24],["Juízes",21],["Rute",4],["1 Samuel",31],["2 Samuel",24],["1 Reis",22],["2 Reis",25],
["1 Crônicas",29],["2 Crônicas",36],["Esdras",10],["Neemias",13],["Ester",10],["Jó",42],["Salmos",150],
["Provérbios",31],["Eclesiastes",12],["Cânticos",8],["Isaías",66],["Jeremias",52],["Lamentações",5],
["Ezequiel",48],["Daniel",12],["Oséias",14],["Joel",3],["Amós",9],["Obadias",1],["Jonas",4],["Miquéias",7],
["Naum",3],["Habacuque",3],["Sofonias",3],["Ageu",2],["Zacarias",14],["Malaquias",4],
["Mateus",28],["Marcos",16],["Lucas",24],["João",21],["Atos",28],["Romanos",16],["1 Coríntios",16],["2 Coríntios",13],
["Gálatas",6],["Efésios",6],["Filipenses",4],["Colossenses",4],["1 Tessalonicenses",5],["2 Tessalonicenses",3],
["1 Timóteo",6],["2 Timóteo",4],["Tito",3],["Filemom",1],["Hebreus",13],["Tiago",5],["1 Pedro",5],["2 Pedro",3],
["1 João",5],["2 João",1],["3 João",1],["Judas",1],["Apocalipse",22]
];

const selLivro = document.getElementById('livro');
const selCap = document.getElementById('capitulo');
livros.forEach(([nome, caps])=>{
  let o=document.createElement('option');o.textContent=nome;o.value=nome;selLivro.appendChild(o);
});

function atualizarCaps(){
  selCap.innerHTML='';
  let livro = livros.find(l=>l[0]==selLivro.value);
  for(let i=1;i<=livro[1];i++){let o=document.createElement('option');o.textContent=i;o.value=i;selCap.appendChild(o);}
}
selLivro.addEventListener('change', atualizarCaps);
atualizarCaps();

document.getElementById('ler').onclick = async ()=>{
  const livro = selLivro.value;
  const cap = selCap.value;
  const div = document.getElementById('versiculos');
  div.innerHTML = '<p class="text-center text-yellow-400 animate-pulse">Carregando '+livro+' '+cap+' - ACF...</p>';
  try{
    // API Bíblia Digital - Almeida ACF
    let res = await fetch(`https://bible-api.com/${encodeURIComponent(livro)}+${cap}?translation=almeida`);
    let data = await res.json();
    if(data.verses){
      div.innerHTML = `<h3 class="font-black text-yellow-400 mb-3">${livro} ${cap} - ACF</h3><div class="biblia space-y-2 text-[17px] leading-7 text-zinc-100">` + 
      data.verses.map(v=>`<p><span class="text-yellow-400 font-bold text-xs mr-2">${v.verse}</span>${v.text}</p>`).join('') + `</div>`;
    } else {
      throw 'sem versos';
    }
  }catch(e){
    div.innerHTML = `<h3 class="font-black text-yellow-400 mb-3">${livro} ${cap}</h3><p class="biblia text-zinc-300">Não foi possível carregar online. Exemplo: <br><br><b>João 3:16</b> - Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.<br><br><i>Conecte-se à internet para ler a Bíblia ACF completa. Todos os 66 livros e capítulos estão habilitados.</i></p>`;
  }
  gerarQr(livro+' '+cap);
};

// CAMPOS DO PREGADOR COM A- A+ SEPARADOS
const campos = [
  {id:'titulo', label:'TÍTULO DA MENSAGEM'},
  {id:'textoBase', label:'TEXTO BASE (Versículo)'},
  {id:'obs', label:'OBSERVAÇÃO / EXEGESE'},
  {id:'aplic', label:'APLICAÇÃO'},
  {id:'ilust', label:'ILUSTRAÇÃO'},
  {id:'frase', label:'FRASE DE EFEITO'}
];
const container = document.getElementById('camposPregacao');
campos.forEach(c=>{
  container.innerHTML += `
  <div class="bg-zinc-900 rounded-xl p-3 border border-zinc-800">
    <div class="flex justify-between items-center">
      <label class="text-[11px] font-bold text-yellow-400">${c.label}</label>
      <div class="flex gap-1">
        <button onclick="ajusta('${c.id}',-1)" class="bg-black border border-zinc-700 w-6 h-6 rounded text-xs">A-</button>
        <button onclick="ajusta('${c.id}',1)" class="bg-black border border-zinc-700 w-6 h-6 rounded text-xs">A+</button>
      </div>
    </div>
    <textarea id="${c.id}" class="w-full mt-2 bg-black border border-zinc-700 rounded-lg p-3 text-sm" style="font-size:16px" rows="3" placeholder="Digite ${c.label.toLowerCase()}..."></textarea>
  </div>`;
});

function ajusta(id, delta){
  let el=document.getElementById(id);
  let s=parseInt(el.style.fontSize)||16;
  s=Math.min(28, Math.max(12, s+delta*2));
  el.style.fontSize=s+'px';
}

document.getElementById('btnNotas').onclick=()=>{
  document.getElementById('bibliaArea').classList.add('hidden');
  document.getElementById('notasArea').classList.remove('hidden');
};

// TIMER AMARELO > VERMELHO
let segundos=0, interval=null, rodando=false;
document.getElementById('btnTimer').onclick=()=>{
  let bar=document.getElementById('timerBar');
  bar.classList.remove('hidden');
  if(!rodando){
    rodando=true;
    interval=setInterval(()=>{
      segundos++;
      let m=String(Math.floor(segundos/60)).padStart(2,'0');
      let s=String(segundos%60).padStart(2,'0');
      let txt=`${m}:${s}`;
      document.getElementById('btnTimer').textContent='⏱️ '+txt;
      bar.textContent=txt+' - PREGANDO';
      bar.className = segundos>1800 ? 'bg-red-600 text-white text-center py-2 font-black text-lg' : 'bg-yellow-400 text-black text-center py-2 font-black text-lg';
    },1000);
  } else {
    clearInterval(interval); rodando=false; segundos=0;
    document.getElementById('btnTimer').textContent='⏱️ 00:00';
    bar.classList.add('hidden'); bar.className='hidden bg-yellow-400 text-black text-center py-2 font-black text-lg';
  }
};

function gerarQr(texto){
  let qrDiv=document.getElementById('qrcode');
  qrDiv.innerHTML='';
  new QRCode(qrDiv, {text: 'https://pulpitoapp.vercel.app/?projecao='+encodeURIComponent(texto), width:160, height:160});
}
document.getElementById('btnQr').onclick=()=>{
  let qr=document.getElementById('qrcode');
  qr.classList.toggle('hidden');
  if(!qr.classList.contains('hidden')) gerarQr(selLivro.value+' '+selCap.value);
};
document.getElementById('btnHoly').onclick=()=>{
  let ip=prompt('Digite o IP do Holyrics (ex: 192.168.0.10):');
  if(ip) alert('Conectando com Holyrics em http://'+ip+':8092 - Funcionalidade Sync ativa! (Configure o Holyrics para receber texto)');
};
function salvarSermao(){
  let dados={}; campos.forEach(c=>dados[c.label]=document.getElementById(c.id).value);
  localStorage.setItem('sermao_'+Date.now(), JSON.stringify(dados));
  alert('Sermão salvo no celular!');
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
