<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PÚLPITO - App dos Servos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-512.png">
<!-- EMAILJS - SEUS DADOS REAIS JÁ CONFIGURADOS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("HtTUEwYxZOHxtBOWu");</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d48;--dark:#0f172a;--border:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#f8fafc;color:var(--dark)}
header{background:var(--dark);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
header h1{font-family:Playfair Display,serif;letter-spacing:3px}
.screen{max-width:520px;margin:0 auto;padding:18px 14px 90px}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:20px;margin-bottom:14px;border:1px solid var(--border)}
input,textarea,select{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:16px;margin-top:8px;outline:none}
.btn{width:100%;padding:15px;background:var(--red);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}
.btn-dark{background:var(--dark)}.btn-ghost{background:#fff;color:var(--dark);border:2px solid var(--border)}
.label{font-size:12px;font-weight:700;text-transform:uppercase;color:#64748b;margin-top:14px;display:block}
.hidden{display:none!important}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 22px;z-index:30;max-width:520px;margin:0 auto}
.tabbar button{border:0;background:none;font-size:11px;font-weight:700;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar button.active{color:var(--red)}.tabbar span{font-size:20px}
.timer-display{font-size:72px;font-weight:800;text-align:center;margin:10px 0}.timer-display.piscando{animation:pisca .8s infinite}
@keyframes pisca{0%,100%{opacity:1;color:var(--red)}50%{opacity:.2}}
.badge{background:#dcfce7;color:#166534;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}
.pulpito-full{position:fixed;inset:0;background:#000;color:#fff;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.pulpito-full .time{font-size:110px;font-weight:800;margin:20px 0}
</style>
</head>
<body>
<header><h1>PÚLPITO</h1><div><button id="logoutBtn" class="hidden" style="background:#1e293b;color:#fff;border:0;padding:8px 12px;border-radius:8px">Sair</button> <span id="userNameHead" style="font-size:12px"></span></div></header>
<div id="authScreen" class="screen">
<div class="card">
<div class="badge">✅ service_hinnu5j + template_cw5rabe CONECTADO</div>
<h2 style="font-family:Playfair Display;font-size:28px;margin-top:10px">Bem-vindo ao App dos Servos</h2>
<p style="color:#64748b;font-size:13px;margin:8px 0">Ao se cadastrar você recebe e-mail automático "Bem-vindo ao PÚLPITO!"</p>
<label class="label">Seu Nome</label><input id="authName" placeholder="Breno Peixoto" />
<label class="label">Seu E-mail</label><input id="authEmail" type="email" placeholder="brenopeixoto900@gmail.com" />
<label class="label">Senha</label><input id="authPass" type="password" placeholder="••••••" />
<button class="btn" id="btnCadastrar">Criar conta e Receber E-mail</button>
<button class="btn btn-ghost" id="btnLogin">Já tenho conta - Entrar</button>
<div id="authMsg" class="hidden" style="margin-top:12px;padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:13px"></div>
</div></div>
<div id="appScreen" class="screen hidden">
<div id="tab-timer" class="tabContent"><div class="card"><h2 style="font-family:Playfair Display">Cronômetro da Pregação</h2><label class="label">Tempo (minutos)</label><input id="minInput" type="number" value="30"><div class="timer-display" id="timerDisplay">30:00</div><div style="display:flex;gap:8px"><button class="btn btn-dark" id="startTimer" style="flex:1">Iniciar</button><button class="btn btn-ghost" id="pauseTimer" style="flex:1">Pausar</button><button class="btn btn-ghost" id="resetTimer" style="flex:1">Reset</button></div><button class="btn" id="abrirPulpitoBtn">ABRA [PÚLPITO] - TELA CHEIA</button></div><div class="card"><p id="timerStatus" style="font-size:13px;color:#64748b">Pronto para pregar.</p></div></div>
<div id="tab-biblia" class="tabContent hidden"><div class="card"><h2>Bíblia Rápida</h2><input id="bibliaInput" placeholder="Ex: João 3:16"><button class="btn btn-dark" id="buscarVerso">Buscar</button><div id="bibliaResult"></div></div></div>
<div id="tab-esbocos" class="tabContent hidden"><div class="card"><h2>Meus Esboços</h2><input id="esbocoTitulo" placeholder="Título"><input id="esbocoTexto" placeholder="Texto Base"><textarea id="esbocoConteudo" rows="8" placeholder="Esboço..."></textarea><button class="btn" id="salvarEsboco">Salvar Esboço</button></div><div id="listaEsbocos"></div></div>
<div id="tab-servos" class="tabContent hidden"><div class="card"><h2>App dos Servos</h2><input id="servoNome" placeholder="Nome do servo"><select id="servoFunc"><option>Pregação</option><option>Louvor</option><option>Recepção</option><option>Mídia</option></select><button class="btn" id="addServo">Adicionar na escala</button></div><div id="listaServos"></div></div>
</div>
<div class="tabbar hidden" id="tabbar"><button data-tab="timer" class="active"><span>⏱️</span>Timer</button><button data-tab="biblia"><span>📖</span>Bíblia</button><button data-tab="esbocos"><span>📝</span>Esboços</button><button data-tab="servos"><span>🙌</span>Servos</button></div>
<div id="pulpitoFull" class="pulpito-full hidden"><h2 style="font-family:Playfair Display;letter-spacing:4px">PÚLPITO</h2><div class="time" id="pulpitoTime">30:00</div><p id="pulpitoNome"></p><button class="btn btn-ghost" style="max-width:200px;color:#fff;border-color:#fff" id="fecharPulpito">Fechar [PÚLPITO]</button></div>
<script src="js/app.js"></script>
</body>
</html>
